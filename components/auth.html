<!-- Auth Screen -->
<div id="auth-screen" class="screen active">
  <div class="auth-wrapper">
    <div class="auth-left">
      <div class="auth-brand">
        <div class="brand-icon">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="12" fill="url(#grad1)"/>
            <path d="M12 28V16l8-6 8 6v12H24v-8h-8v8H12z" fill="#fff"/>
            <defs><linearGradient id="grad1" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#192335"/><stop offset="1" stop-color="#242840"/></linearGradient></defs>
          </svg>
        </div>
        <h1>SurvivalFi</h1>
        <p>Track expenses. Predict your financial survival. Stay in control.</p>
      </div>
      <div class="auth-features">
        <div class="feature-item">
          <div class="feature-icon">📊</div>
          <span>Smart Survival Score</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">🔔</div>
          <span>Impulsive Spend Alerts</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">💰</div>
          <span>Income & Expense Tracking</span>
        </div>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-card">
        <h2 id="auth-title">Sign In</h2>
        <form id="auth-form">
          <div class="form-group">
            <label for="auth-email">Email</label>
            <input type="email" id="auth-email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="auth-password">Password</label>
            <input type="password" id="auth-password" placeholder="••••••••" required>
          </div>
          <button type="submit" id="auth-submit" class="btn btn-primary btn-full">Sign In</button>
        </form>

        <div class="auth-forgot">
          <a href="#" id="auth-forgot-link">Forgot password?</a>
        </div>

        <div class="auth-divider"><span>or</span></div>

        <div class="auth-oauth">
          <button id="oauth-google" class="btn btn-outline btn-full oauth-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" class="oauth-icon"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continue with Google
          </button>
          <button id="oauth-github" class="btn btn-outline btn-full">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="oauth-icon"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            Continue with GitHub
          </button>
        </div>

        <div class="auth-toggle-wrap">
          <button id="auth-toggle" class="btn btn-ghost auth-toggle-btn">Create Account</button>
        </div>

        <div class="auth-local-note">
          <button id="auth-local-mode" class="btn btn-ghost auth-local-btn">Continue without account (local only)</button>
        </div>
      </div>
    </div>
  </div>
</div>
